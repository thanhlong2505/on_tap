<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn tập SQA – Ngân hàng câu hỏi 06/2026</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f27;--mu:#667085;--bd:#e2e5ea;--ac:#2f5bea;--acs:#e8eefe;--ok:#12805c;--oks:#e3f6ee;--no:#c0352b;--nos:#fdeceb;--warn:#a15c07;--warns:#fff3df;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--card:#1b1e27;--tx:#e9ebf1;--mu:#98a0b3;--bd:#2c303c;--ac:#7c9bff;--acs:#232a44;--ok:#4fd1a1;--oks:#15332a;--no:#ff8a80;--nos:#3a1f1e;--warn:#f2b45a;--warns:#3a2d14}}
:root[data-theme="dark"]{--bg:#12141a;--card:#1b1e27;--tx:#e9ebf1;--mu:#98a0b3;--bd:#2c303c;--ac:#7c9bff;--acs:#232a44;--ok:#4fd1a1;--oks:#15332a;--no:#ff8a80;--nos:#3a1f1e;--warn:#f2b45a;--warns:#3a2d14}
.card{scroll-margin-top:10px}*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 48px}
h1{font-size:1.2rem;margin:4px 0 2px}.sub{color:var(--mu);font-size:.88rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.st b{display:block;font-size:1.45rem;line-height:1.2}.st span{color:var(--mu);font-size:.8rem}
.bar{height:10px;background:var(--bd);border-radius:99px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.bar.seen i{background:var(--ac)}
.chk{border-radius:10px;padding:9px 12px;font-size:.92rem;margin:10px 0;background:var(--warns);color:var(--warn)}
.chk.full{background:var(--oks);color:var(--ok)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:.8rem}
.tag{background:var(--acs);color:var(--ac);border-radius:99px;padding:2px 10px;font-weight:600}
.tag.re{background:var(--warns);color:var(--warn)}
.q{font-size:1.06rem;font-weight:600;margin:0 0 12px}
.q p{margin:0 0 8px}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;overflow-x:auto;font:.85rem/1.45 ui-monospace,Menlo,Consolas,monospace;margin:0 0 10px;font-weight:400}
.img{background:#fff;border-radius:8px;padding:6px;margin:0 0 10px;overflow-x:auto}.img img{display:block;max-width:100%;height:auto;margin:0 auto}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:12px;padding:11px 12px;margin:0 0 9px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ac);background:var(--acs)}
.opt .l{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.opt.ok{border-color:var(--ok);background:var(--oks)}.opt.ok .l{background:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nos)}.opt.no .l{background:var(--no);color:#fff}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:10px 12px;margin:4px 0 12px;font-size:.93rem}
.fb.ok{background:var(--oks);color:var(--ok)}.fb.no{background:var(--nos);color:var(--no)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--mu);border:1px solid var(--bd);font-weight:500;padding:7px 12px;font-size:.85rem}
.btn.d{color:var(--no);border-color:var(--no)}
details{margin-top:12px}summary{cursor:pointer;color:var(--mu);font-size:.9rem}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}
.hint{color:var(--mu);font-size:.78rem;margin-top:12px}

.tabs{display:flex;gap:8px;margin:0 0 12px}.tab{flex:1;background:var(--card);color:var(--mu);border:1.5px solid var(--bd);border-radius:10px;padding:9px;font:inherit;font-weight:600;cursor:pointer}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tool select,.tool input[type=search]{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font:inherit;font-size:.9rem}
.tool input[type=search]{flex:1;min-width:150px}
.tool label{font-size:.88rem;display:flex;gap:6px;align-items:center;cursor:pointer}
.vq{margin-bottom:10px}.vq .opt{cursor:default;margin-bottom:6px;padding:8px 10px}.vq .opt:hover{background:var(--card);border-color:var(--bd)}
.vq .opt.ok:hover{background:var(--oks);border-color:var(--ok)}
.vq .q{font-size:1rem}
ol.miss{padding-left:20px;font-size:.88rem}ol.miss li{margin-bottom:6px}
</style>
</head>

iew) quan tâm đến yếu tố nào sau đây?"]],"o":["Số lượng lỗi và Chi phí làm lại","Số passed testcase trên tổng số các testcase.","Tính dễ hiểu và dễ thao tác.","Cả ba yếu tố trên"],"a":0,"f":1},{"k":"2-211","g":2,"id":"211","lv":null,"s":[["p","Trong các ý sau đây ý nào là quan trọng nhất trong việc lựa chọn phương pháp kiểm thử?"]],"o":["Sử dụng các công cụ có sẵn để hỗ trợ các phương pháp được đề xuất.","Ngân sách cho phép đào tạo trong việc đề xuất các phương pháp.","Sử dụng các kỹ năng và kinh nghiệm có sẵn trong các phương pháp được đề xuất.","Các nhóm kiểm thử sẵn sàng để tìm hiểu các kỹ thuật mới."],"a":2},{"k":"2-215","g":2,"id":"215","lv":"TB","s":[["p","Chọn phát biểu đúng nhất trong các phát biểu sau:"]],"o":["Mục đích của thử nghiệm beta là để tìm các thiếu sót,và để có được thông tin phản hồi từ các lĩnh vực về khả năng sử dụng của sản phẩm.","Mục đích của thử nghiệm beta không phải là để tìm các thiếu sót, mà để có được thông tin phản hồi từ các lĩnh vực về khả năng sử dụng của sản phẩm.","Quyết định về việc khi nào phát hành hệ thống cho khách hàng phiên bản beta được thực hiện bởi nhóm phát triển phần mềm.","Có hai loại beta là : tiếp thị beta và kĩ thuật beta."],"a":1},{"k":"2-218","g":2,"id":"218","lv":"TB","s":[["p","Nhận xét đúng về mô hình lỗi (Defect Model):"]],"o":["Đại diện cho vòng đời của một lỗi từ khi báo cáo đến khi kết thúc thông qua các luồng trạng thái.","Là mô hình mô tả luồng dữ liệu của hệ thống","Là mô hình mô tả các thực thể trong cơ sở dẽ liệu","Là mô hình mô tả các chức năng của hệ thống"],"a":0},{"k":"2-219","g":2,"id":"219","lv":"TB","s":[["p","Nhận xét đúng về các khái niệm trong mô hình lỗi (Defect Model):"]],"o":["Trong mô hình lỗi có 2 khái niệm: lỗi nhẹ, lỗi quan trọng","Trong mô hình lỗi có 2 khái niệm: độ ưu tiên, độ nghiêm trọng","Trông mô hình lỗi có 2 khái niệm: độ ưu tiên, lỗi quan trọng","Tất cả các đáp án đều sai"],"a":1,"f":1},{"k":"2-228","g":2,"id":"228","lv":"TB","s":[["p","Thành phần nào không nằm trong kiểm  (Cyclomatic Complexity) là gì trong kiểm thử đường đi cơ bản?"]],"o":["Số lượng đường đi có thể có trong một chương trình.","Số lượng nút trong đồ thị luồng điều khiển.","Số lượng cạnh trong đồ thị luồng điều khiển.","Một chỉ số đo độ phức tạp của chương trình, tính bằng cách sử dụng số lượng cạnh và nút (đỉnh) trong đồ thị luồng điều khiển (đồ thị chương trình)."],"a":3},{"k":"3-089","g":3,"id":"089","lv":"KHO","s":[["p","Tại sao kiểm thử luồng dữ liệu lại quan trọng đối với chất lượng phần mềm?"]],"o":["Nó giúp tối ưu hóa mã nguồn để giảm độ phức tạp.","Nó đảm bảo rằng tất cả các biến được xử lý một cách chính xác, từ đó giảm thiểu lỗi logic và thời gian chạy.","Nó giúp tăng tốc độ chạy của chương trình.","Nó đảm bảo rằng tất cả các chức năng của giao diện người dùng đều hoạt động đúng."],"a":1,"f":1},{"k":"3-108","g":3,"id":"108","lv":"KHO","s":[["p","Đỉnh hợp nhất được gán nhãn như thế nào trong đồ thị luồng điều khiển:"]],"o":["Gán nhãn bởi một số nguyên","Gán nhãn bởi một tên xác định","Gán nhãn bởi một ký tự","Không gán nhãn"],"a":3},{"k":"3-113","g":3,"id":"113","lv":"KHO","s":[["p","Để kiểm tra một chức năng, lập trình viên phải viết một …….., nó gọi chức năng và khai thác nó để kiểm tra?"]],"o":["Stub","Driver","Proxy","Không đáp án nào"],"a":1,"f":1},{"k":"3-119","g":3,"id":"119","lv":"KHO","s":[["p","Thế nào là bao phủ câu lệnh (statement coverage):"]],"o":["Thực hiện mọi câu lệnh trong chương trình ít nhất một lần","Thực hiện ít nhất một câu lệnh trong chương trình","Thực hiện tất cả các đường đi trong chương trình","Tất cả đều đúng"],"a":0,"f":1},{"k":"3-120","g":3,"id":"120","lv":"KHO","s":[["p","Thế nào là bao phủ rẽ nhánh (branch coverage):"]],"o":["Thực hiện mọi câu lệnh trong chương trình ít nhất một lần","Thực hiện tất cả các lệnh rẽ nhánh trong chương trình","Thực hiện ít nhất một đường đi trong chương trình","Thực hiện ít nhất một câu lệnh trong chương trình"],"a":1,"f":1},{"k":"3-133","g":3,"id":"133","lv":"KHO","s":[["p","Thử nghiệm đủ đã đư  định tất cả các lớp tương đương của dữ liệu.","Tối ưu hóa mã nguồn để giảm độ phức tạp."],"a":1,"f":1},{"k":"5-072","g":5,"id":"072","lv":"TB","s":[["p","Trong công thức tính độ phức tạp chu trình V(G) = E - N + 2P, ký hiệu N đại diện cho gì?"]],"o":["Số lượng đỉnh (nút) trong đồ thị.","Số lượng cạnh trong đồ thị.","Số lượng đường dẫn trong đồ thị.","Số lượng chu trình trong đồ thị."],"a":0},{"k":"5-073","g":5,"id":"073","lv":"TB","s":[["p","Trong công thức tính độ phức tạp chu trình V(G) = E - N + 2P, ký hiệu E đại diện cho gì?"]],"o":["Số lượng đỉnh (nút) trong đồ thị.","Số lượng cạnh trong đồ thị.","Số lượng đường đi trong đồ thị.","Số lượng chu trình trong đồ thị."],"a":1},{"k":"5-078","g":5,"id":"078","lv":"TB","s":[["p","Một bảng quyết định hoàn chỉnh và chính xác cần đảm bảo điều gì?"]],"o":["A. Tất cả các giá trị biên được kiểm tra.","B. Tất cả các điều kiện và hành động tương ứng đều được liệt kê và kiểm tra.","C. Tất cả các lớp tương đương của dữ liệu được xác định.","D. Tất cả các yếu tố giao diện người dùng đều hoạt động đúng."],"a":1,"f":1},{"k":"5-082","g":5,"id":"082","lv":"TB","s":[["p","Điều gì xảy ra nếu một điều kiện trong bảng quyết định không được đáp ứng?"]],"o":["Tất cả các hành động tương ứng sẽ được thực hiện.","Không có hành động nào sẽ được thực hiện.","Điều kiện đó sẽ được bỏ qua.","Điều kiện đó sẽ được kiểm tra lại."],"a":1,"f":1},{"k":"5-085","g":5,"id":"085","lv":"TB","s":[["p","Một bảng quyết định bao gồm các thành phần nào?"]],"o":["Các điều kiện và hành động.","Các giá trị biên và lớp tương đương.","Các đường đi và chu trình.","Các nút và cạnh."],"a":0},{"k":"5-090","g":5,"id":"090","lv":"TB","s":[["p","Trong kiểm thử luồng dữ liệu, thuật ngữ \"Define-Use\" có nghĩa là gì?"]],"o":["Một biến được định nghĩa và sử dụng trong cùng một dòng mã.","Một biến được xác định ở một điểm và được sử dụng ở một điểm khác.","Một biến được định nghĩa nhưng không bao giờ được sử dụng.","Một biến được sử dụng nhưng không bao giờ được định nghĩa."],"a":1},{"k":"5-092","g":5,"id":"092","lv":"TB","s":[["p","Khi nào thì kiểm thử luồng dữ liệu được coi là hoàn chỉnh?"]],"o":["Khi tất cả các giá trị biên được kiểm tra.","Khi tất cả các biến trong chương trình đều được khai báo, gán giá trị và sử dụng một cách chính xác.","Khi tất cả các lớp tương đương của dữ liệu được kiểm tra.","Khi tất cả các yếu tố giao diện người dùng đều hoạt động đúng."],"a":1,"f":1},{"k":"5-094","g":5,"id":"094","lv":"TB","s":[["p","Trong kiểm thử luồng dữ liệu, thuật ngữ \"DU Path\" đại diện cho gì?"]],"o":["Đường đi từ điểm khai báo đến điểm gán giá trị.","Đường đi từ điểm gán giá trị đến điểm sử dụng.","Đường đi từ điểm sử dụng đến điểm khai báo.","Đường đi từ điểm gán giá trị đến điểm khai báo."],"a":1},{"k":"5-095","g":5,"id":"095","lv":"TB","s":[["p","Kiểm thử luồng dữ liệu tập trung vào việc kiểm tra các khía cạnh nào của biến trong chương trình?"]],"o":["Khai báo (Definition), gán giá trị (Assignment), và sử dụng (Usage).","Chỉ gán giá trị (Assignment).","Chỉ khai báo (Definition).","Chỉ sử dụng (Usage)."],"a":0},{"k":"5-098","g":5,"id":"098","lv":"TB","s":[["p","Nếu một đầu vào có dải giá trị từ 1 đến 100, thì số lớp tương đương hợp lệ và không hợp lệ là gì?"]],"o":["A. 1 lớp hợp lệ và 1 lớp không hợp lệ.","B. 1 lớp hợp lệ và 2 lớp không hợp lệ.","C. 2 lớp hợp lệ và 2 lớp không hợp lệ.","D. 1 lớp hợp lệ và 3 lớp không hợp lệ."],"a":1,"f":1},{"k":"5-099","g":5,"id":"099","lv":"TB","s":[["p","Làm thế nào để xác định số lượng trường hợp kiểm thử cần thiết trong kiểm thử lớp tương đương?"]],"o":["Bằng cách kiểm tra từng giá trị biên của mỗi lớp.","Bằng cách chọn một giá trị từ mỗi lớp tương đương hợp lệ và không hợp lệ.","Bằng cách kiểm tra tất cả các giá trị đầu vào có thể có.","Bằng cách chọn các giá trị trung bình từ mỗi lớp."],"a":1,"f":1},{"k":"5-100","g":5,"id":"100","lv":"TB","s":[["p","Một lớp tương đương không hợp lệ là gì?"]],"o":["Một lớp chứa các giá trị đầu vào nằm trong phạm vi cho phép.","Một lớp chứa các giá trị đầu vào  Critical:"]],"o":["Khuyết tật ở mức độ này phải được giải quyết càng sớm càng tốt, và quá trình kiểm thử không nên tiếp tục khi khuyết tật ở mức này chưa được sửa","Khuyết tật ở mức độ này sẽ không ảnh hưởng đến quá trình kiểm thử","Khuyết tật ở mức độ này có thể giải quyết bất kì lúc nào","Khuyết tật có mức độ ưu tiên cao và ảnh hưởng dến một tập nhỏ các chức năng của hệ thống"],"a":0},{"k":"5-221","g":5,"id":"221","lv":"TB","s":[["p","Nhân xét đúng về lỗi có độ ưu tiên ở mức cao (high)"]],"o":["Lỗi ở mức độ này sẽ không ảnh hưởng đến tiến độ kiểm thử.","Lỗi ở mức độ này nên được giải quyết bất kỳ lúc nào có thể","Lỗi ở mức độ này ở mức ưu tiên cao, quá trình kiểm thử phải dừng lại khi lỗi này chưa giải quyết được","Lỗi ở mức độ này ở mức ưu tiên cao, một tập hợp chức năng con của hệ thống không thể kiểm thử nếu lỗi này chưa được giải quyết"],"a":3},{"k":"5-222","g":5,"id":"222","lv":"TB","s":[["p","Nhận xét đúng về độ quan trọng của lỗi ở mức thấp (low)"]],"o":["Nếu nhiều chức năng quan trọng của hệ thống bị suy yếu do lỗi này","Nếu một số chức cơ bản của hệ thông bị suy yếu","Nếu không có chức năng quan trọng nào của hệ thống bị suy yếu","Nếu vấn đề liên quan đến tính năng giao diện của hệ thống"],"a":3},{"k":"5-223","g":5,"id":"223","lv":"TB","s":[["p","Nhận xét đúng về độ ưu tiên và độ nghiêm trọng quá trình kiểm thử"]],"o":["Mức độ nghiêm trọng của một khuyết tật vẫn giữ nguyên trong vòng đời của nó, còn mức độ ưu tiên thì có thể thay đổi","Mức độ nghiêm trọng của một khuyết tật và mức độ ưu tiên không thay đổi trong suốt vòng đời","Mức độ ưu tiên không thay đổi còn mức độ nghiêm trọng thay đổi trong vòng đời của nó","Tất cả các đáp án đều sai"],"a":0,"f":1},{"k":"5-231","g":5,"id":"231","lv":"TB","s":[["p","Để đo được tính hiệu quả của việc kiểm thử, một công thức được sử dụng phổ biến trong công nghiệp là tính giá trị DRE (defect removal efficiency). Giá trị DRE được tính bằng công thức:"]],"o":["Số lỗi tìm được trong kiểm thử","Số lỗi tìm được + số lỗi khô 0% bao phủ quyết định (decision coverage)?"]],"o":["2","không rõ ràng.","1","4"],"a":0},{"k":"5-287","g":5,"id":"287","lv":"TB","s":[["p","Trong kiểm thử đơn vị thì đối tượng dùng để kiểm thử là một Module. Module được hiểu là gì?"]],"o":["Một lớp.","Phương thức.","Một thành phần(Component)","Tùy theo cách hiểu."],"a":3},{"k":"5-288","g":5,"id":"288","lv":"TB","s":[["p","Kiểm thử được chia làm nhiều cấp độ, cấp độ nào là đơn giản nhất?"]],"o":["Kiểm thử đơn vị.","Kiểm thử tích hợp.","Kiểm thử hệ thống.","Kiểm thử chấp nhận."],"a":0},{"k":"5-290","g":5,"id":"290","lv":"TB","s":[["p","Từ góc nhìn giá trị của phần mềm (Value-based view), thì một phần mềm như thế nào được đánh giá là chất lượng?"]],"o":["Phần mềm dễ bảo trì.","Phần mềm đem lại lợi nhuận cao cho tổ chức.","Phần mềm có giao diện đẹp.","Một đáp án khác."],"a":1,"f":1},{"k":"5-291","g":5,"id":"291","lv":"TB","s":[["p","Định nghĩa kiểm chứng (verification) và thẩm định (validation) nào sau đây là đúng?"]],"o":["Cả hai đều có ý nghĩa giống nhau.","Kiểm chứng có thể hiểu là việc xây dựng phần mềm có đúng đặc tả, đúng thiết kế hay không. Còn thẩm định có nghĩa là việc xây dựng phần mềm có đáp ứng được nhu cầu của người dùng không.","Thẩm định có thể hiểu là việc xây dựng phần mềm có đúng đặc tả, đúng thiết kế. Còn kiểm chứng có nghĩa là việc xây dựng phần mềm có đáp ứng được nhu cầu của người dùng không.","Kiểm chứng là dùng công cụ kiểm tra tự động. Còn thẩm định là thực hiện thủ công."],"a":1,"f":1},{"k":"5-292","g":5,"id":"292","lv":"TB","s":[["p","Thứ tự thực hiện đúng của kiểm chứng (verification) và thẩm định (Validation) là:"]],"o":["Không cần thứ tự, 2 công việc trên có thể làm đan xen lẫn nhau.","Kiểm chứng, rồi đến thẩm định.","Thẩm định rồi đến kiểm chứng.","Một đáp án khác."],"a":1,"f":1},{"k":"5-293","g":5,"id":"293","lv":"TB","s":[["p","Trong quá trình kiểm thử, mục tiêu quan trọng nhất là"]],"o":["Tìm ra nhiều lỗi nhất có thể.","Kiểm tra được các khu vực có nguy cơ xảy ra lỗi cao.","Đạt được độ bao phủ kiểm thử tốt.","Để đánh giá phần mềm đã sẵn sàng cho phát hành."],"a":1},{"k":"5-296","g":5,"id":"296","lv":"TB","s":[["p","Chọn một lý do không hợp lý khi nói việc kiểm thử đầy đủ là không khả thi:"]],"o":["Miền đầu vào là quá lớn để kiểm tra.","Giới hạn về nguồn lực tài chính.","Không thể kiểm tra hết các đường khả thi trong chương trình phần mềm.","Các vấn đề giao diện người dùng là quá phức tạp để kiểm tra hoàn toàn."],"a":1},{"k":"6-019","g":6,"id":"019","lv":"KHO","s":[["p","Thành phần nào sau đây không được coi là một đơn vị"]],"o":["Hàm","Lớp","Module","Phương thức"],"a":2},{"k":"6-021","g":6,"id":"021","lv":"KHO","s":[["p","Kiểm thử giao diện lập trình ứng dụng - API testing là phương pháp nằm trong chiến lược kiểm thử nào."]],"o":["Kiểm thử hộp đen","Kiểm thử hộp trắng","Kiểm thử hộp xám","Kiểm thử hộp xám và hộp đen"],"a":1},{"k":"6-024","g":6,"id":"024","lv":"KHO","s":[["p","Nêu ra các loại kiểm thử trong intergration test."]],"o":["Kiểm thử cấu trúc","Kiểm thử chức năng","Kiểm thử hiệu năng, kiểm thử cấu trúc","Kiểm thử cấu trúc, kiểm thử chức năng, kiểm thử hiệu năng, kiểm thử khả năng chịu tải."],"a":3},{"k":"6-035","g":6,"id":"035","lv":"KHO","s":[["p","Trong đồ thị chương trình, một đường đi từ điểm nguồn đến điểm đích đại diện cho điều gì?"]],"o":["A. Một lỗi trong chương trình.","B. Một luồng điều khiển có thể xảy ra.","C. Một chức năng chính của chương trình.","D. Một luồng dữ liệu."],"a":1,"f":1},{"k":"6-068","g":6,"id":"068","lv":"KHO","s":[["p","Trong kiểm thử đường đi cơ bản (Basic Path Testing), một đường đi độc lập là gì?"]],"o":["Một đường đi bao gồm tất cả các giá trị biên.","Một đường đi duy nhất từ điểm bắt đầu đến điểm kết thúc mà không lặp lại bất kỳ cạnh nào.","Một đường đi được thực hiện nhiều lần trong quá trình kiểm thử.","Một đường đi chứa ít nhất một cạnh hoặc đỉnh mới chưa được đi qua trong bất kỳ đường đi nào trước đó."],"a":3,"f":1},{"k":"6-070","g":6,"id":"070","lv":null,"s":[["p","Một chương trình có độ phức tạp chu trình bằng 1 có nghĩa là gì?"]],"o":["Chương trình có một chu trình duy nhất.","Chương trình có cấu trúc tuyến tính mà không có bất kỳ đường đi phân nhánh nào.","Chương trình có một lỗi logic.","Chương trình có một điểm vào và một điểm ra duy nhất."],"a":1},{"k":"6-074","g":6,"id":"074","lv":null,"s":[["p","Công thức tính độ phức tạp chu trình (Cyclomatic Complexity) là gì?"]],"o":["V(G) = E - N + 2P","V(G) = E + N - 2P","V(G) = E - N - 2P","V(G) = E + N + 2P"],"a":0},{"k":"6-088","g":6,"id":"088","lv":"KHO","s":[["p","Kiểm thử luồng dữ liệu giúp phát hiện loại lỗi nào sau đây?"]],"o":["A. Lỗi do sử dụng biến chưa được khởi tạo.","B. Lỗi do khai báo biến không cần thiết.","C. Lỗi do sử dụng biến ngoài phạm vi.","D. Cả A và C."],"a":3,"f":1},{"k":"6-089","g":6,"id":"089","lv":"KHO","s":[["p","Tại sao kiểm thử luồng dữ liệu lại quan trọng đối với chất lượng phần mềm?"]],"o":["Nó giúp tối ưu hóa mã nguồn để giảm độ phức tạp.","Nó đảm bảo rằng tất cả các biến được xử lý một cách chính xác, từ đó giảm thiểu lỗi logic và thời gian chạy.","Nó giúp tăng tốc độ chạy của chương trình.","Nó đảm bảo rằng tất cả các chức năng của giao diện người dùng đều hoạt động đúng."],"a":1,"f":1},{"k":"6-091","g":6,"id":"091","lv":"KHO","s":[["p","Để phát hiện lỗi sử dụng biến chưa được khởi tạo, kiểm thử luồng dữ liệu thường kiểm tra điều gì?"]],"o":["Các giá trị biên của biến.","Các đường đi từ điểm khai báo đến điểm sử dụng biến.","Các đường đi từ điểm gán giá trị đến điểm sử dụng biến.","Các điều kiện trong bảng quyết định."],"a":2},{"k":"6-093","g":6,"id":"093","lv":"KHO","s":[["p","Một biến chưa được khởi tạo mà đã được sử dụng có thể dẫn đến lỗi nào?"]],"o":["Lỗi biên dịch.","Lỗi logic.","Lỗi thời gian chạy.","Lỗi giao diện người dùng."],"a":2},{"k":"6-123","g":6,"id":"123","lv":"KHO","s":[["p","Điều nào sau đây đúng?"],["i","data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAbsAAABRCAMAAAB8H/h8AAAASFBMVEX//////v7+/Pz9+fn99vb88vL77e345OT22dn00NDww8PssbHoo6Pll5fiiYnffHzaaGjUU1PRRUXOOTnLLC <script>
(function(){
var Q=JSON.parse(document.getElementById('d').textContent),N=Q.length,KEY='sqa_quiz_v1',byK={};
Q.forEach(function(q){byK[q.k]=q});
var LV={DE:'Dễ',TB:'Trung bình',KHO:'Khó'},L=['A','B','C','D'];
var started=false,S=load(),cur=null,answered=false,resetArm=false,tab='quiz',perm=[0,1,2,3];
if(S.shuf===undefined)S.shuf=true;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fresh(){return{v:N,shuf:true,queue:shuffle(Q.map(function(q){return q.k})),done:{},seen:{},total:0,wrongs:0,first:0}}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===N&&s.queue&&s.queue.every(function(k){return byK[k]}))return s}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function cnt(o){return Object.keys(o).length}
function pendingWrong(){return S.queue.filter(function(k){return S.seen[k]&&S.seen[k].w>0}).length}
function renderStats(){
  var seen=cnt(S.seen),done=cnt(S.done),left=S.queue.length,box=document.getElementById('stats'),y0=window.scrollY;
  var g=el('div','stats');
  [[seen+'/'+N,'Đã làm ít nhất 1 lần'],[done+'/'+N,'Đã đúng (xong)'],[left,'Còn lại trong hàng đợi'],[pendingWrong(),'Sai, đang chờ làm lại'],[S.total,'Tổng lượt trả lời'],[S.wrongs,'Tổng lượt sai']].forEach(function(p){var s=el('div','st');s.appendChild(el('b',null,p[0]));s.appendChild(el('span',null,p[1]));g.appendChild(s)});
  var c=el('div','card');
  c.appendChild(el('span',null,'Tiến độ đã gặp câu hỏi: '+seen+'/'+N+' ('+Math.round(seen/N*100)+'%)'));
  var b1=el('div','bar seen');b1.appendChild(el('i'));b1.firstChild.style.width=seen/N*100+'%';c.appendChild(b1);
  c.appendChild(el('span',null,'Tiến độ hoàn thành (đã đúng): '+done+'/'+N+' ('+Math.round(done/N*100)+'%)'));
  var b2=el('div','bar');b2.appendChild(el('i'));b2.firstChild.style.width=done/N*100+'%';c.appendChild(b2);
  var full=seen===N;
  c.appendChild(el('div','chk'+(full?' full':''),full?'✓ Đã làm đủ '+N+'/'+N+' câu (mỗi câu ít nhất 1 lần).':'Chưa đủ: còn '+(N-seen)+' câu chưa làm lần nào ('+seen+'/'+N+').'));
  var d=el('details');d.appendChild(el('summary',null,'Thống kê theo nhóm'));
  var sc=el('div','sc'),t=el('table'),h=el('tr');
  ['Nhóm','Số câu','Đã làm','Đã đúng','Còn lại'].forEach(function(x){h.appendChild(el('th',null,x))});t.appendChild(h);
  for(var gi=1;gi<=6;gi++){var qs=Q.filter(function(q){return q.g===gi});if(!qs.length)continue;
    var a=qs.length,s=qs.filter(function(q){return S.seen[q.k]}).length,dn=qs.filter(function(q){return S.done[q.k]}).length,r=el('tr');
    [ 'Group '+gi+' ('+LV[qs[0].lv]+')',a,s+'/'+a,dn+'/'+a,a-dn].forEach(function(x){r.appendChild(el('td',null,x))});t.appendChild(r)}
  sc.appendChild(t);d.appendChild(sc);c.appendChild(d);
  var rr=el('div','row');rr.style.marginTop='12px';
  var rb=el('button','btn g d',resetArm?'Bấm lần nữa để xác nhận làm lại từ đầu':'Làm lại từ đầu');
  rb.onclick=function(){if(!resetArm){resetArm=true;renderStats();return}resetArm=false;var sh=S.shuf;S=fresh();S.shuf=sh;save();cur=null;renderStats();next()};
  var nf=Q.filter(function(q){return !q.f}).length;
  var sb=el('button','btn g',S.shuf?'Đảo đáp án: BẬT':'Đảo đáp án: TẮT');sb.title='Chỉ đảo '+nf+' câu an toàn; '+(N-nf)+' câu có phương án kiểu “Cả A và B…” được giữ nguyên thứ tự.';
  sb.onclick=function(){S.shuf=!S.shuf;save();renderStats()};
  rr.appendChild(sb);rr.appendChild(rb);c.appendChild(rr);
  c.appendChild(el('div','hint','Đảo đáp án áp dụng cho '+nf+'/'+N+' câu; '+(N-nf)+' câu có phương án như “Cả A và B đều đúng” luôn giữ nguyên thứ tự. Thay đổi có hiệu lực từ câu kế tiếp.'));box.replaceChildren(g,c);window.scrollTo(0,y0);
}
function stemInto(q,x){
  x.s.forEach(function(b){
    if(b[0]==='i'){var w=el('div','img'),im=new Image();im.src=b[1];im.alt='Hình minh họa của câu hỏi';w.appendChild(im);q.appendChild(w)}
    else if(b[0]==='c')q.appendChild(el('pre',null,b[1]));
    else q.appendChild(el('p',null,b[1]));
  });
}
function next(){
  answered=false;var m=document.getElementById('main');m.innerHTML='';
  if(!S.queue.length){finish(m);return}
  cur=byK[S.queue[0]];var st=S.seen[cur.k],c=el('div','card');c.style.marginTop='12px';
  var meta=el('div','meta');
  meta.appendChild(el('span','tag','Còn '+S.queue.length+' câu'));
  meta.appendChild(el('span','tag','Group '+cur.g+' · '+LV[cur.lv]));
  meta.appendChild(el('span',null,'Mã câu '+cur.id));
  if(st&&st.w>0)meta.appendChild(el('span','tag re','Làm lại · đã sai '+st.w+' lần'));
  c.appendChild(meta);
  var q=el('div','q');stemInto(q,cur);c.appendChild(q);
  perm=(S.shuf&&!cur.f)?shuffle([0,1,2,3]):[0,1,2,3];
  var ob=el('div');
  perm.forEach(function(oi,i){
    var b=el('button','opt');b.type='button';b.dataset.i=i;
    b.appendChild(el('span','l',L[i]));b.appendChild(el('span',null,cur.o[oi]));
    b.onclick=function(){pick(i)};ob.appendChild(b)});
  c.appendChild(ob);
  var fb=el('div');fb.id='fb';c.appendChild(fb);
  c.appendChild(el('div','hint','Phím tắt: 1–4 hoặc A–D để chọn đáp án, Enter để sang câu tiếp.'));
  m.appendChild(c);if(started)c.scrollIntoView({block:'start'});started=true;
}
function pick(i){
  if(answered)return;answered=true;
  var q=cur,ok=perm[i]===q.a,cd=perm.indexOf(q.a),rec=S.seen[q.k]||(S.seen[q.k]={n:0,w:0});
  var firstTry=rec.n===0;rec.n++;S.total++;
  S.queue.shift();
  if(ok){S.done[q.k]=1;if(firstTry)S.first++}
  else{rec.w++;S.wrongs++;var pos=S.queue.length?1+Math.floor(Math.random()*S.queue.length):0;S.queue.splice(pos,0,q.k)}
  save();
  var bs=document.querySelectorAll('.opt');
  bs.forEach(function(b,k){b.disabled=true;if(k===cd)b.classList.add('ok');else if(k===i)b.classList.add('no')});
  var fb=document.getElementById('fb');fb.innerHTML='';
  fb.appendChild(el('div','fb '+(ok?'ok':'no'),ok?'Chính xác! Câu này đã xong, sẽ không xuất hiện lại.':'Chưa đúng. Đáp án đúng là '+L[cd]+'. Câu này đã được trộn lại vào phần chưa làm.'));
  var r=el('div','row'),nb=el('button','btn',S.queue.length?'Câu tiếp →':'Xem kết quả');nb.onclick=next;r.appendChild(nb);fb.appendChild(r);
  renderStats();
  nb.focus({preventScroll:true});fb.scrollIntoView({block:'nearest'});
}
function finish(m){
  var c=el('div','card');c.style.marginTop='12px';
  c.appendChild(el('h2',null,'Hoàn thành toàn bộ '+N+' câu 🎉'));c.firstChild.style.margin='0 0 8px';
  var seen=cnt(S.seen);
  c.appendChild(el('p',null,'Đã làm '+seen+'/'+N+' câu, tất cả đều đã đúng. Tổng '+S.total+' lượt trả lời, trong đó '+S.wrongs+' lượt sai; đúng ngay lần đầu: '+S.first+'/'+N+' câu ('+Math.round(S.first/N*100)+'%).'));
  var miss=Object.keys(S.seen).filter(function(k){return S.seen[k].w>0}).sort(function(a,b){return S.seen[b].w-S.seen[a].w}).slice(0,15);
  if(miss.length){c.appendChild(el('h3',null,'Các câu sai nhiều nhất'));var ol=el('ol','miss');
    miss.forEach(function(k){var q=byK[k],t=q.s.filter(function(b){return b[0]==='p'}).map(function(b){return b[1]}).join(' ')||'(câu có hình)';
      ol.appendChild(el('li',null,'['+q.id+'] '+(t.length>110?t.slice(0,110)+'…':t)+' — sai '+S.seen[k].w+' lần'))});c.appendChild(ol)}
  var b=el('button','btn','Ôn lại từ đầu');b.onclick=function(){var sh=S.shuf;S=fresh();S.shuf=sh;save();renderStats();next()};c.appendChild(b);
  m.appendChild(c);
}
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey||tab!=='quiz'||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;var k=e.key.toLowerCase(),map={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3};
  if(!answered&&cur&&S.queue.length&&map[k]!==undefined){pick(map[k]);e.preventDefault()}
  else if(answered&&(k==='enter'||k===' ')){var nb=document.querySelector('#fb .btn');if(nb&&document.activeElement!==nb){e.preventDefault();next()}}
});
var vs={g:0,q:'',a:true},vbuilt=false;
function renderView(){
  var box=document.getElementById('viewbox');
  if(!vbuilt){vbuilt=true;box.innerHTML='';
    var tl=el('div','tool'),sel=el('select');
    var o0=el('option',null,'Tất cả nhóm');o0.value=0;sel.appendChild(o0);
    for(var g=1;g<=6;g++){var n=Q.filter(function(q){return q.g===g}).length;if(!n)continue;var o=el('option',null,'Group '+g+' ('+n+' câu)');o.value=g;sel.appendChild(o)}
    sel.onchange=function(){vs.g=+sel.value;fillView()};
    var si=el('input');si.type='search';si.placeholder='Tìm theo nội dung hoặc mã câu…';si.oninput=function(){vs.q=si.value.trim().toLowerCase();fillView()};
    var lb=el('label'),ck=el('input');ck.type='checkbox';ck.checked=true;ck.onchange=function(){vs.a=ck.checked;fillView()};lb.appendChild(ck);lb.appendChild(document.createTextNode('Hiện đáp án đúng'));
    tl.appendChild(sel);tl.appendChild(si);tl.appendChild(lb);box.appendChild(tl);
    var cn=el('div','hint');cn.id='vcount';cn.style.margin='0 0 10px';box.appendChild(cn);
    var list=el('div');list.id='vlist';box.appendChild(list);
  }
  fillView();
}
function fillView(){
  var list=document.getElementById('vlist');list.innerHTML='';var shown=0;
  Q.forEach(function(x){
    if(vs.g&&x.g!==vs.g)return;
    if(vs.q){var hay=(x.id+' '+x.s.filter(function(b){return b[0]!=='i'}).map(function(b){return b[1]}).join(' ')+' '+x.o.join(' ')).toLowerCase();if(hay.indexOf(vs.q)<0)return}
    shown++;var c=el('div','card vq'),m=el('div','meta');
    m.appendChild(el('span','tag','Group '+x.g+' · '+LV[x.lv]));m.appendChild(el('span',null,'Mã câu '+x.id));
    c.appendChild(m);var q=el('div','q');stemInto(q,x);c.appendChild(q);
    x.o.forEach(function(t,i){var b=el('div','opt'+(vs.a&&i===x.a?' ok':''));b.appendChild(el('span','l',L[i]));b.appendChild(el('span',null,t));c.appendChild(b)});
    list.appendChild(c);
  });
  document.getElementById('vcount').textContent='Hiển thị '+shown+'/'+N+' câu (thứ tự gốc trong đề, đáp án giữ nguyên A–D).';
  if(!shown)list.appendChild(el('p',null,'Không có câu nào khớp.'));
}
function setTab(t){
  tab=t;document.getElementById('t1').classList.toggle('on',t==='quiz');document.getElementById('t2').classList.toggle('on',t==='view');
  document.getElementById('quizbox').hidden=t!=='quiz';document.getElementById('viewbox').hidden=t!=='view';
  if(t==='view')renderView();window.scrollTo(0,0);
}
document.getElementById('t1').onclick=function(){setTab('quiz')};
document.getElementById('t2').onclick=function(){setTab('view')};
renderStats();next();
})();
</script>
</body>
</html>
